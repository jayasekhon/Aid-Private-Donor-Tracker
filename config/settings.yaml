# =============================================================================
# SETTINGS — the main dials for this project
# =============================================================================
# This file uses a simple "name: value" format. To change something, edit
# the value after the colon and save. Keep quotes " " around text values.
# Lines starting with "#" are notes and are ignored.
# =============================================================================

site:
  title: "Corporate Giving Monitor"
  subtitle: "Independent Tracker of Private Donations to UN Agencies & NGOs"
  # Shown in the footer of every page.
  footer_note: "Built to surface private-sector donations not centrally logged elsewhere. Not an official OCHA product."
  # How many days of past editions to keep linked in the "Older" archive.
  archive_days_kept: 90

search:
  # Only consider news items published within this many days. Google News'
  # search results are ranked by RELEVANCE, not recency — a keyword-heavy
  # query can easily surface an old story (we've seen one from years ago)
  # that matches well, crowding out today's actual news. This restricts the
  # Google News query itself to this window (via "when:Nd") and also drops
  # anything older than this that slips through anyway (e.g. from PR wire
  # feeds, which have no equivalent recency filter). Raise this if genuinely
  # current donations are being missed because their publish date is
  # missing/unreliable; lower it if stale stories still get through.
  #
  # Lowered from 60 to 14: a real run at 60 discarded 1,819 of 3,543 raw
  # items (over half) as stale — that's a lot of old content competing for
  # Google's bounded per-query result slots ahead of genuinely current
  # stories. GDELT and PR wires are effectively unaffected by this value
  # (GDELT's own items are always near-real-time by construction; PR wire
  # feeds only ever list recent releases anyway) — this mainly tightens
  # Google News specifically.
  max_article_age_days: 14

  # Whether to also pull from GDELT's Global Knowledge Graph (GKG) — a much
  # broader, more international/multilingual public news monitor, updated
  # every 15 minutes, that GDELT publishes as downloadable bulk files
  # rather than a live search API (see src/gdelt_gkg.py — an earlier
  # attempt using GDELT's live search API hit persistent rate-limiting
  # from GitHub Actions' shared runner IPs). Meant to catch regional or
  # non-English coverage Google News misses. Set to false to fall back to
  # Google News + PR wire feeds only, e.g. if GDELT proves too noisy or
  # its results turn out low-quality after a few real runs.
  gdelt_enabled: true

  # Per-source on/off switches, mainly for testing one source in isolation.
  # All three sources are on for normal running — GDELT-only isolation
  # testing (see git history) has served its purpose; each source has
  # real, distinct coverage gaps the others fill (GDELT: broad/regional/
  # multilingual coverage but weak on some ambiguous-name companies and
  # un-syndicated corporate blogs; Google News: reliable literal-text
  # matching but recipient-anchored and English-heavy; PR wires: direct
  # company-published CSR/donation releases GDELT/Google News can miss
  # entirely).
  google_news_enabled: true
  pr_wire_feeds_enabled: true

  # Media Cloud (mediacloud.org) — a real structured news search API/
  # index, complementary to Google News (an RSS-search-string hack — see
  # query_builder.py's docstring on its reliability quirks) and GDELT (a
  # much broader, noisier, multilingual firehose — see gdelt_gkg.py).
  # Needs a free API key from search.mediacloud.org, set as the
  # MEDIACLOUD_API_KEY secret (see .github/workflows/daily.yml) — leave
  # this false until that secret is actually set, since enabling it
  # without a key fails the whole run immediately (a clear error, not a
  # silent skip — see mediacloud_source.py). MEDIACLOUD_API_KEY is set as
  # of 2026-09-18, so this is now on.
  mediacloud_enabled: false
  # Which Media Cloud collection to query. #9272347 = "Global English
  # Language Sources" (~1,600 curated English-language sources) —
  # recommended: this pipeline is English-only throughout (trigger
  # phrases, extraction prompt, alias matching), so a curated English
  # collection is both more relevant and dramatically lower-noise than
  # the alternative, #8876987 "Global Voices Cited Sources" (11,000+
  # sources, heavily multilingual, weighted toward citizen/alternative
  # media rather than mainstream press).
  mediacloud_collection_id: 9272347
  # Recipients AND trigger phrases are both batched into groups, not
  # ORed together all at once — two separate real-run problems drove
  # this (see mediacloud_source.py's module docstring for the full
  # investigation). Pulling the real mediacloud==4.3.0 client source
  # from PyPI confirmed it does NOT self-throttle requests despite an
  # unrelated-looking constant on its base class — a real run fired 7
  # batch queries within 0.79 seconds of each other. This pipeline paces
  # calls itself instead (31s apart, mediacloud_source.py's
  # _pace_queries()), matching Media Cloud's own documented "roughly 2
  # requests/minute" limit.
  mediacloud_recipients_per_query: 8
  # Separately, a real run showed EVERY batch query — not just the
  # first, and regardless of query size or pacing — failing with "API
  # Server Error 403". Rate limiting, query size, and auth header format
  # were all ruled out in turn (see mediacloud_source.py's module
  # docstring). The actual cause, found once mediacloud_source.py started
  # calling the API directly and could capture the real response body
  # instead of the `mediacloud` pip client discarding it: a plain,
  # specific permission error — {"status": "error", "note": "You
  # are not permitted to fetch `expanded` stories."} — nothing to do with
  # a WAF or bot detection. This account's plan can't fetch expanded
  # (full body text) stories, so every request asking for it was
  # rejected identically regardless of content or timing. Fixed by simply
  # not requesting expanded=1; results now carry title/url/publish_date/
  # media_name only, no body text. Trigger-phrase batching (15/batch) is
  # kept regardless, as a real improvement on its own merits even though
  # it didn't turn out to explain the 403s.
  #
  # Once Media Cloud actually started returning results, a real run
  # showed a second, separate problem: 845 candidates passed the local
  # trigger-phrase filter that day, 764 of them from Media Cloud, almost
  # all noise (BRICS summit coverage, Houthi/Yemen war reporting,
  # market-research spam) -- burning most of the day's 350-call AI
  # budget for close to zero net-new real donations. Root cause: Media
  # Cloud's query uses config/mediacloud_trigger_phrases.txt, a
  # deliberately smaller, higher-precision subset of trigger_phrases.txt
  # (see that file's own docstring) -- it drops bare, generic verbs like
  # "commits"/"contributes"/"partners with" that are fine for Google
  # News (each query already anchored to one recipient) but match
  # constantly in Media Cloud's full-text search across ~1,600 sources.
  # At 18 phrases, the whole curated list fits in one batch, halving the
  # request count: 7 recipient-batches x 1 trigger-batch = 7 requests/day
  # (~49/week) against a 4,000/week default quota, roughly 4 minutes of
  # paced runtime.
  mediacloud_triggers_per_query: 20

ai:
  # Which AI provider does the extraction step: "bedrock" (via AWS, paid
  # per-token, no daily request ceiling) or "gemini" (Google's free tier,
  # hard-capped at ~20 requests/day).
  #
  # AWS Marketplace/Private Marketplace approval for Claude on Bedrock was
  # denied, so this now uses Amazon Nova Pro instead — a first-party AWS
  # model that needs NO Marketplace approval at all (that's exactly the
  # process that got denied for Claude), just the Bedrock console's
  # "Model access" page enabled for it, which is an instant self-service
  # step. Nova Pro was picked over the cheaper/faster Nova Micro and Nova
  # Lite because this workload needs real judgment calls (rejecting vague
  # donors/recipients, telling a corporate donation apart from a
  # government one, following a strict JSON schema) that the smaller Nova
  # tiers are more likely to get wrong.
  provider: "bedrock"

  # --- Bedrock settings (only used when provider is "bedrock") ---
  # Model ID as it appears on AWS Bedrock. Calls go through AWS's own
  # Converse API (see extraction.py's _call_bedrock), which is model-
  # agnostic — this ID is the only thing that would need to change to
  # switch models again later (e.g. back to Claude, if approval comes
  # through eventually).
  #
  # A real run confirmed the bare foundation-model ID ("amazon.nova-pro-v1:0")
  # is NOT invokable on-demand in this setup — AWS returned:
  # "Invocation of model ID amazon.nova-pro-v1:0 with on-demand throughput
  # isn't supported. Retry your request with the ID or ARN of an inference
  # profile that contains this model." This is the cross-region inference
  # profile ID instead (same mechanism as Claude's earlier "global." prefix
  # — see git history). "eu." is the expected prefix for bedrock_region
  # below being an EU region; double-check this exact string is listed as
  # invokable on the Bedrock console's "Model access" / cross-region
  # inference page before relying on it, since it wasn't independently
  # confirmed there (only inferred from AWS's own documented profile-ID
  # convention) before this config change.
  bedrock_model: "eu.amazon.nova-pro-v1:0"
  # AWS region to call Bedrock in.
  bedrock_region: "eu-north-1"

  # --- Gemini settings (only used when provider is "gemini") ---
  # If you see a 404 "model no longer available" error in the Actions log
  # while on this provider, check https://ai.google.dev/gemini-api/docs/models
  # for the current model name and update this line.
  model: "gemini-3.6-flash"

  # Safety cap: the pipeline will never make more than this many AI calls in
  # one run, no matter how many stories are found. What this protects
  # against differs by provider:
  #   - On Gemini's free tier, this guards the daily request quota.
  #   - On Bedrock (the active provider now), there's no free-tier wall —
  #     this instead bounds worst-case COST. At Nova Pro pricing ($0.80 /
  #     $3.20 per million input/output tokens — noticeably cheaper than
  #     Claude Haiku's $1 / $5) and this workload's typical prompt size
  #     (~1,500 input / ~250 output tokens per call), each call costs
  #     roughly $0.002.
  #
  #     A real full day's run with all three sources on (GDELT + Google
  #     News + PR wires) produced ~318 event clusters — well above the
  #     old cap of 100, which meant over two thirds of that day's real
  #     candidates were skipped rather than analysed. Raised to 350 to
  #     comfortably cover a normal day with some headroom, rather than
  #     tuned to the exact observed number. Worst case (every day of the
  #     month hits the cap): 350 x $0.002 x 30 = ~$21/month — a real
  #     day's actual spend will typically be well under that, since 350
  #     is a ceiling, not the expected daily count.
  # When there are more candidate clusters than this budget allows, the
  # highest-priority ones (most corroborated, clearest stated figures) are
  # processed first; the rest are logged as skipped rather than silently
  # dropped — see the "Sources & Limitations" page after a run.
  max_ai_calls_per_run: 350
  # How many days back a new story is checked against, to decide whether
  # it's a duplicate/renewal of something already published.
  dedupe_lookback_days: 180

confidence:
  # The four-part scoring rubric. Do not change the field names, only the
  # points, if you want to rebalance how confidence is calculated. The
  # four factors can sum above 10 (e.g. an official source + a stated
  # amount + multiple sources + a monitored recipient) — the final score
  # is clipped to 10 so the "X/10" badge never reads oddly.
  source_tier_points:
    official_press_release_or_agency_newsroom: 4
    wire_service: 3
    general_news: 2
    social_media_or_blog: 1
  explicit_amount_stated_points: 3
  multiple_independent_sources_points: 3
  # Bonus for the recipient being one of the curated 50 organizations
  # this tracker is specifically anchored on (see recipients.txt) — a
  # different kind of signal from the other three, which are all about
  # how well-EVIDENCED a story is. This one is about how squarely it's
  # in scope for the project's actual purpose. Added after a real entry
  # ("Visa partners with the World Bank," single source, no dollar
  # figure) scored a bare 2/10 despite being exactly the kind of finding
  # this tracker exists to surface — under the old three-factor rubric,
  # a monitored recipient with weak sourcing scored identically to an
  # off-list local charity with equally weak sourcing, which didn't
  # reflect that the former is core to this project's purpose and the
  # latter is a bonus catch. Set close to the other factors' weight (3)
  # so it can meaningfully lift a weakly-sourced monitored-recipient
  # story out of "low confidence" on its own, not just nudge it.
  monitored_recipient_points: 3
  # Bonus for the recipient being an actual, specifically named
  # organization rather than a vague description ("Palestinian aid
  # groups", "the flood relief effort") that only publishes at all
  # because it's tied to a specific, in-scope place -- see
  # run_daily.py's recipient-vagueness handling. A real case: Macklemore
  # pledging $1M "to Palestinian aid groups" without ever naming which
  # one -- still worth publishing (it's a real, sourced, in-scope
  # donation), but a materially weaker finding than a story that names
  # exactly who the money went to, and the score should say so.
  # Entries with a properly named recipient (the normal case) get this
  # automatically; only the vague-but-in-scope exception ever misses it.
  specific_recipient_named_points: 2
  # Entries scoring below this are still published, but visually marked
  # "Low confidence" and excluded from the weekly email highlights.
  low_confidence_threshold: 5

publishing:
  # If true, unearmarked/global donations with no named country are
  # included and tagged "scope: unspecified" rather than being dropped.
  include_unspecified_scope: true
  # Maximum number of items shown on the daily front page before the
  # rest move to a "More today" section.
  max_front_page_items: 8

email:
  enabled: false   # set to true once SMTP/API details below are filled in
  send_day: "Friday"          # which day of the week the digest goes out
  subject_prefix: "Weekly Corporate Giving Digest"
  # Comma-separated list of recipient email addresses.
  recipients: "example@example.org"
  # Sending method: "resend" (recommended, free tier) or "smtp"
  method: "resend"
  from_address: "digest@example.org"
  # Only used if method is "smtp":
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
