name: Daily donation scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # required so GitHub can mint the OIDC token this workflow presents to AWS to assume the Bedrock role — nothing else changes about repo permissions

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config files
        run: python src/config_loader.py

      - name: Configure AWS credentials (for Bedrock, via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543936965927:role/github-actions-donation-tracker-bedrock
          aws-region: eu-north-1
          # No stored AWS secret involved — GitHub mints a short-lived OIDC
          # token for this run, AWS exchanges it for temporary credentials
          # scoped to exactly this role, and they expire when the job ends.

      - name: Run the daily pipeline
        env:
          # Only used if config/settings.yaml's ai.provider is "gemini";
          # harmless to leave set otherwise. Bedrock auth comes from the
          # step above instead, via the environment, not a secret here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_daily.py

      - name: Commit updated data and site
        run: |
          git config user.name "donation-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
